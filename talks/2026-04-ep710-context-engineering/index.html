<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ep 710: Context Engineering: How to Get Expert-Level Outputs From AI Chatbots</title>
  <style>
    :root{--bg:#0b1220;--panel:#0f1a33;--text:#e8eefc;--muted:#a9b7d6;--hl:#ffe08a;--hlText:#1b1b1b;--bd:rgba(255,255,255,.12);--accent:#7aa2ff}
    body{margin:0;padding-bottom:env(safe-area-inset-bottom);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,var(--bg),#070b14);color:var(--text)}
    header{position:sticky;top:0;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);z-index:10}
    .wrap{max-width:980px;margin:0 auto;padding:14px 12px}
    h1{margin:0 0 6px;font-size:16px}
    .sub{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
    .player{margin-top:10px;padding:12px;background:rgba(15,26,51,.8);border:1px solid var(--bd);border-radius:14px}
    audio{width:100%}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--bd);border-radius:999px;background:rgba(255,255,255,.03);color:var(--muted);font-size:12px}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    select,button{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12px}
    button{cursor:pointer}
    .panel{margin-top:12px;background:rgba(15,26,51,.7);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
    .panel h2{margin:0;padding:12px;font-size:13px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.08)}
    .lines{max-height:calc(100dvh - 320px);overflow:auto;padding:10px 10px 100px 10px;scroll-behavior:smooth}
    .line{display:flex;gap:10px;padding:10px;border-radius:12px;border:1px solid transparent}
    .line:hover{background:rgba(255,255,255,.03)}
    .t{min-width:70px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
    .txt{flex:1;line-height:1.35;font-size:14px}
    .current{background:var(--hl);color:var(--hlText);border-color:rgba(0,0,0,.12)}
    .current .t{color:rgba(0,0,0,.62)}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Ep 710: Context Engineering: How to Get Expert-Level Outputs From AI Chatbots</h1>
    <p class="sub">Line-level highlighting synced to narration audio. Tap a line to jump.</p>
    <div class="player">
      <audio id="audio" controls preload="metadata">
        <source src="https://cdn1.genspark.ai/user-upload-image/audio_merge/results/merged_audio.0ff77d4a.mp3" type="audio/mpeg">
      </audio>
      <div class="controls">
        <span class="chip">Audio: <a href="https://cdn1.genspark.ai/user-upload-image/audio_merge/results/merged_audio.0ff77d4a.mp3" target="_blank" rel="noreferrer">Source</a></span>
        <span class="chip">Timing: <a href="https://www.genspark.ai/api/files/s/yEihCrRz" target="_blank" rel="noreferrer">Source</a></span>
        <label class="chip">Speed
          <select id="speed">
            <option value="0.8">0.8×</option>
            <option value="0.9">0.9×</option>
            <option value="1" selected>1.0×</option>
            <option value="1.1">1.1×</option>
            <option value="1.25">1.25×</option>
          </select>
        </label>
        <button id="follow">Auto-follow: ON</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="panel">
    <h2>Transcript</h2>
    <div class="lines" id="lines"></div>
  </section>
</main>
<script>
  /* iOS Safari fix v2: visualViewport + calc(100dvh-320px) + padding-bottom:100px */
  const segments = [
    {s:0.12,e:1.84,t:"Good morning, everyone."},
    {s:1.90,e:2.18,t:"Today,"},
    {s:2.30,e:6.88,t:"I want to talk about a major shift in how we use artificial intelligence in business."},
    {s:7.74,e:17.26,t:"A couple of years ago, everyone believed that prompt engineering was the future, thinking the secret to AI was knowing exactly how to talk to the machine."},
    {s:17.28,e:22.84,t:"But today, the narrative has shifted dramatically, and prompt engineering is practically obsolete."},
    {s:23.60,e:24.40,t:"Why did this happen?"},
    {s:25.22,e:34.82,t:"Modern AI models have become incredibly smart and can now handle misspellings, access uploaded files, and integrate directly with dynamic business systems."},
    {s:35.51,e:40.64,t:"The bottleneck is no longer how you phrase your question, but the information you provide behind it."},
    {s:41.25,e:47.58,t:"This shift has led to the rise of a new essential skill for business leaders: context engineering."},
    {s:47.62,e:56.38,t:"To understand why this is critical, we need to look at a recent study by Intuition Labs, which found that forty percent of corporate AI projects fail."},
    {s:57.10,e:63.10,t:"The primary reason for this high failure rate is not bad AI technology, but poor context."},
    {s:63.90,e:67.16,t:"Think of an AI model like a highly capable new employee."},
    {s:67.74,e:74.60,t:"If you just give them a complex task with a one-sentence instruction and no background information, they will fail."},
    {s:74.64,e:75.80,t:"They need context."},
    {s:76.58,e:80.20,t:"In AI, this working memory is called the context window."},
    {s:80.98,e:91.47,t:"Context engineering is the systematic process of providing the AI with the right background about your role, what you are trying to accomplish, your business, and your competitive market."},
    {s:92.22,e:93.58,t:"So, how do we do this?"},
    {s:94.40,e:100.21,t:"There is a practical framework consisting of six building blocks you must include in your AI's context window."},
    {s:101.06,e:105.66,t:"First is the goal: what the AI needs to produce and for whom."},
    {s:106.36,e:110.98,t:"Second is constraints: the rules, boundaries, and formatting requirements."},
    {s:111.60,e:116.42,t:"Third is reference material: your approved company facts and data."},
    {s:116.54,e:119.72,t:"Fourth is examples of good and bad outputs."},
    {s:120.42,e:124.30,t:"Fifth is procedures: step-by-step instructions for the task."},
    {s:124.84,e:130.80,t:"And sixth is an evaluation rubric: grading criteria so the AI can assess its own work."},
    {s:131.56,e:133.62,t:"But providing these blocks is not enough."},
    {s:134.14,e:136.88,t:"You must apply them across four specific layers."},
    {s:137.60,e:141.66,t:"You need the personal layer, defining your individual role and expertise;"},
    {s:142.30,e:145.32,t:"the team layer, defining your shared project goals;"},
    {s:145.86,e:150.81,t:"the company layer, including your brand voice, policies, and proprietary knowledge;"},
    {s:151.44,e:156.43,t:"and finally, the market layer, which covers industry trends and your competitive position."},
    {s:157.14,e:164.42,t:"Missing context at any of these layers will dramatically reduce the quality of your AI's output, regardless of how good your prompt is."},
    {s:165.14,e:171.20,t:"Now, you might be thinking this sounds extremely time-consuming, and it is, if you do it from scratch every time."},
    {s:171.92,e:177.26,t:"That is why the most successful companies are building context vaults or reusable skills."},
    {s:178.04,e:188.58,t:"Instead of training an AI chatbot from zero with every new project, you save your procedures, rubrics, and approved facts into modular collections."},
    {s:189.22,e:194.46,t:"You can then reuse these vaults systematically for new projects or team onboarding."},
    {s:195.48,e:202.68,t:"To turn this good context into truly expert-level outputs, you should also use three simple techniques."},
    {s:203.70,e:211.26,t:"First, use few-shot examples by giving the AI multiple examples of correct and incorrect work."},
    {s:212.44,e:219.80,t:"Second, use a rubric-first approach by providing grading criteria before the AI generates its answer."},
    {s:220.88,e:223.92,t:"Finally, show, don't tell."},
    {s:223.96,e:229.98,t:"Paste the exact format you want the output to look like rather than just abstractly describing it."},
    {s:231.30,e:240.88,t:"In conclusion, to succeed with AI today, you must stop starting with a simple question, and instead, start with a structured context pack."},
    {s:241.80,e:245.90,t:"Build, document, and reuse your context vaults."},
    {s:246.82,e:258.22,t:"The organizations that prioritize structured business context over clever prompting are the ones that will extract expert-level insights and drive real business value."},
    {s:259.08,e:259.40,t:"Thank you."}
  ];
  const audio   = document.getElementById("audio");
  const linesEl = document.getElementById("lines");
  const speed   = document.getElementById("speed");
  const followBtn = document.getElementById("follow");
  let follow = true, current = -1;
  const fmt = sec => `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,"0")}`;
  segments.forEach((seg,i)=>{
    const row = document.createElement("div");
    row.className = "line"; row.dataset.i = i;
    row.innerHTML = `<div class="t">${fmt(seg.s)}</div><div class="txt">${seg.t}</div>`;
    row.onclick = () => { audio.currentTime = seg.s + 0.01; audio.play().catch(()=>{}); };
    linesEl.appendChild(row);
  });
  speed.onchange = () => audio.playbackRate = Number(speed.value);
  followBtn.onclick = () => { follow = !follow; followBtn.textContent = `Auto-follow: ${follow?"ON":"OFF"}`; };
  function findIndex(t){
    for(let i=0;i<segments.length;i++){ if(t>=segments[i].s && t<segments[i].e) return i; }
    for(let i=segments.length-1;i>=0;i--){ if(t>=segments[i].s) return i; }
    return 0;
  }
  function effectiveBottom(){
    const c = linesEl.getBoundingClientRect();
    if(window.visualViewport){
      const vvB = window.visualViewport.offsetTop + window.visualViewport.height;
      return Math.min(c.bottom, vvB);
    }
    return c.bottom;
  }
  function setCurrent(i){
    if(i===current) return;
    const prev = linesEl.querySelector(".current");
    if(prev) prev.classList.remove("current");
    current = i;
    const cur = linesEl.querySelector(`.line[data-i="${i}"]`);
    if(cur){
      cur.classList.add("current");
      if(follow){
        const pad = 32;
        const c = linesEl.getBoundingClientRect();
        const r = cur.getBoundingClientRect();
        const eB = effectiveBottom() - pad;
        if(r.top < c.top + pad){
          linesEl.scrollBy({top: r.top - (c.top + pad), behavior:"smooth"});
        } else if(r.bottom > eB){
          linesEl.scrollBy({top: r.bottom - eB, behavior:"smooth"});
        }
      }
    }
  }
  audio.addEventListener("timeupdate", ()=> setCurrent(findIndex(audio.currentTime)));
  audio.addEventListener("loadedmetadata", ()=> setCurrent(findIndex(0)));
</script>
</body>
</html>
