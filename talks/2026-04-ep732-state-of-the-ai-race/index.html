<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ep 732: The State of the AI Race. Who will win in 2026: OpenAI, Microsoft, Google Or Anthropic (Start Here Series Vol 12)</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1a33;
      --text:#e8eefc;
      --muted:#a9b7d6;
      --hl:#ffe08a;
      --hlText:#1b1b1b;
      --bd:rgba(255,255,255,.12);
      --accent:#7aa2ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding-bottom:env(safe-area-inset-bottom);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg),#070b14);
      color:var(--text);
    }
    header{
      position:sticky;
      top:0;
      background:rgba(11,18,32,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--bd);
      z-index:10;
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:14px 12px;
    }
    h1{
      margin:0 0 6px;
      font-size:16px;
      line-height:1.35;
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    .player{
      margin-top:10px;
      padding:12px;
      background:rgba(15,26,51,.8);
      border:1px solid var(--bd);
      border-radius:14px;
    }
    audio{width:100%}
    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px;
    }
    .chip{
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:6px 10px;
      border:1px solid var(--bd);
      border-radius:999px;
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
    }
    a{
      color:var(--accent);
      text-decoration:none;
    }
    a:hover{text-decoration:underline}
    select,button{
      background:rgba(255,255,255,.05);
      color:var(--text);
      border:1px solid var(--bd);
      border-radius:10px;
      padding:6px 10px;
      font-size:12px;
    }
    button{cursor:pointer}
    .panel{
      margin-top:12px;
      background:rgba(15,26,51,.7);
      border:1px solid var(--bd);
      border-radius:14px;
      overflow:hidden;
    }
    .panel h2{
      margin:0;
      padding:12px;
      font-size:13px;
      color:var(--muted);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .lines{
      max-height:calc(100dvh - 320px);
      overflow:auto;
      padding:10px 10px 100px 10px;
      scroll-behavior:smooth;
    }
    .line{
      display:flex;
      gap:10px;
      padding:10px;
      border-radius:12px;
      border:1px solid transparent;
    }
    .line:hover{background:rgba(255,255,255,.03)}
    .t{
      min-width:70px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
      font-size:12px;
    }
    .txt{
      flex:1;
      line-height:1.4;
      font-size:14px;
    }
    .current{
      background:var(--hl);
      color:var(--hlText);
      border-color:rgba(0,0,0,.12);
    }
    .current .t{color:rgba(0,0,0,.62)}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Ep 732: The State of the AI Race. Who will win in 2026: OpenAI, Microsoft, Google Or Anthropic (Start Here Series Vol 12)</h1>
    <p class="sub">Line-level highlighting synced to narration audio. Tap a line to jump.</p>

    <div class="player">
      <audio id="audio" controls preload="metadata">
        <source src="https://cdn1.genspark.ai/user-upload-image/audio_merge/results/merged_audio.d60c11b7.mp3" type="audio/mpeg">
      </audio>

      <div class="controls">
        <span class="chip">Audio: <a href="https://cdn1.genspark.ai/user-upload-image/audio_merge/results/merged_audio.d60c11b7.mp3" target="_blank" rel="noreferrer">Source</a></span>
        <span class="chip">Timing: <a href="https://www.genspark.ai/api/files/s/uhYuMmii" target="_blank" rel="noreferrer">Source</a></span>

        <label class="chip">Speed
          <select id="speed">
            <option value="0.8">0.8×</option>
            <option value="0.9">0.9×</option>
            <option value="1" selected>1.0×</option>
            <option value="1.1">1.1×</option>
            <option value="1.25">1.25×</option>
          </select>
        </label>

        <button id="follow">Auto-follow: ON</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Transcript</h2>
    <div class="lines" id="lines"></div>
  </section>
</main>

<script>
  const segments = [
    {s:0.12,e:0.92,t:"Good morning, everyone."},
    {s:1.60,e:5.96,t:"Today, we need to discuss a critical question for our business strategy:"},
    {s:6.70,e:10.22,t:"Who will win the AI race in twenty twenty-six?"},
    {s:10.31,e:15.82,t:"And more importantly, how should our company navigate this highly competitive landscape?"},
    {s:16.66,e:19.18,t:"We are looking at a race dominated by the Big Four:"},
    {s:19.89,e:20.68,t:"OpenAI,"},
    {s:21.14,e:21.48,t:"Google,"},
    {s:21.92,e:23.96,t:"Microsoft, and Anthropic."},
    {s:24.84,e:28.98,t:"However, the nature of this race has fundamentally changed."},
    {s:29.00,e:32.84,t:"The era of the simple AI chatbot is officially over."},
    {s:33.58,e:37.26,t:"Today, we are in the era of agentic systems."},
    {s:38.10,e:50.14,t:"These are autonomous AI systems capable of executing complex business workflows and connecting directly with our daily data to deliver actionable enterprise-ready outputs."},

    {s:51.26,e:56.44,t:"To understand where we are, let us look at the incredible numbers driving this industry right now."},
    {s:57.30,e:60.81,t:"OpenAI is the undisputed leader in consumer adoption."},
    {s:61.44,e:70.14,t:"They have reached a staggering nine hundred million weekly active users and are generating an annualized revenue of twenty-five billion dollars."},
    {s:70.94,e:71.76,t:"Their newest model,"},
    {s:72.12,e:82.78,t:"GPT 5.4, is performing exceptionally well, achieving an eighty-three percent win or tie rate when compared to human experts in blind tests."},
    {s:83.50,e:88.04,t:"They have become completely synonymous with AI for the general public."},

    {s:88.08,e:92.78,t:"However, the enterprise and full stack race is much more complex."},
    {s:93.68,e:102.35,t:"Google is taking a massive share of the market with seven hundred fifty million monthly active users and eight million paid enterprise seats."},
    {s:103.28,e:106.43,t:"Google's true advantage is its multimodal capability."},
    {s:107.05,e:113.40,t:"They are the only major provider natively handling video alongside text, image, and audio."},
    {s:114.10,e:118.36,t:"By deeply integrating Gemini into Google Workspace, including Gmail,"},
    {s:118.60,e:119.79,t:"Drive, and Docs,"},
    {s:120.40,e:127.29,t:"Google is transforming daily operations so employees can analyze their data from anywhere within their organization."},

    {s:128.26,e:132.17,t:"Then we have Microsoft, which remains the enterprise control plane."},
    {s:133.09,e:138.60,t:"Microsoft has a major head start because its software is heavily embedded in corporate environments."},
    {s:139.23,e:148.36,t:"They currently have fifteen million paid Copilot seats with a remarkable ninety percent penetration rate among Fortune five hundred companies."},
    {s:149.18,e:151.68,t:"While their learning and governance curve can be high,"},
    {s:152.16,e:155.76,t:"Microsoft embeds AI by default across Word,"},
    {s:156.06,e:156.54,t:"Excel,"},
    {s:156.92,e:158.29,t:"Teams, and Outlook."},
    {s:159.07,e:170.63,t:"They are also heavily invested in the broader AI ecosystem, holding a twenty-seven percent stake in OpenAI's public benefits corporation and committing five billion dollars to Anthropic."},

    {s:171.60,e:174.90,t:"Finally, we must talk about Anthropic."},
    {s:174.92,e:184.96,t:"While they do not have the massive user base of OpenAI or Google, they are a financial powerhouse, reporting twenty billion dollars in annual recurring revenue."},
    {s:185.88,e:188.89,t:"Anthropic is winning in the premium intelligence layer."},
    {s:189.52,e:194.24,t:"Their models excel in complex reasoning and technical applications."},
    {s:194.32,e:197.34,t:"This is especially true in the new agent coding war."},
    {s:197.62,e:210.64,t:"Anthropic's Claude Code alone is reportedly responsible for four percent of all GitHub commits and reached two point five billion dollars in annual revenue within months of its launch."},
    {s:211.86,e:222.76,t:"Coding is the first area where AI is delivering direct, quantifiable productivity gains, and Anthropic is leading this high-value technical space."},

    {s:222.80,e:225.64,t:"The financial stakes are astronomical."},
    {s:225.70,e:230.90,t:"These companies are spending unbelievable amounts of money on infrastructure and data centers."},
    {s:231.76,e:243.46,t:"OpenAI is targeting six hundred billion dollars in compute spend through twenty thirty, while Google is planning up to one hundred eighty-five billion dollars in capital expenditures."},

    {s:244.64,e:247.80,t:"So what does this mean for us as business leaders?"},
    {s:248.71,e:254.12,t:"The winner in twenty twenty-six will not just be the company with the smartest model."},
    {s:254.16,e:263.72,t:"It will be the provider that best integrates seamlessly into our proprietary business data to deliver enterprise-grade results."},

    {s:263.80,e:266.22,t:"Our strategy must be flexible."},
    {s:266.25,e:273.58,t:"We must avoid relying entirely on a single vendor because models and platforms change constantly."},
    {s:273.62,e:276.19,t:"We need a modular approach."},
    {s:276.19,e:279.55,t:"We might use OpenAI for broad everyday tasks,"},
    {s:280.16,e:285.35,t:"Google for multimodal content and scalable workspace integration,"},
    {s:285.40,e:292.39,t:"Anthropic for deep technical and coding work, and Microsoft for strict security and governance."},
    {s:293.46,e:301.40,t:"We must stop treating AI as a simple chatbot and start redesigning our internal workflows for agentic systems."},
    {s:302.34,e:312.96,t:"By preparing contingency plans and matching the right platform to the right problem, we can turn this AI competition into our own sustained business advantage."},
    {s:314.12,e:315.12,t:"Thank you for your time."}
  ];

  const audio = document.getElementById("audio");
  const linesEl = document.getElementById("lines");
  const speed = document.getElementById("speed");
  const followBtn = document.getElementById("follow");

  let follow = true;
  let current = -1;

  const fmt = sec => `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,"0")}`;

  segments.forEach((seg, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.dataset.i = i;
    row.innerHTML = `<div class="t">${fmt(seg.s)}</div><div class="txt">${seg.t}</div>`;
    row.onclick = () => {
      audio.currentTime = seg.s + 0.01;
      audio.play().catch(()=>{});
    };
    linesEl.appendChild(row);
  });

  speed.onchange = () => {
    audio.playbackRate = Number(speed.value);
  };

  followBtn.onclick = () => {
    follow = !follow;
    followBtn.textContent = `Auto-follow: ${follow ? "ON" : "OFF"}`;
  };

  function findIndex(t){
    for(let i=0;i<segments.length;i++){
      if(t >= segments[i].s && t < segments[i].e) return i;
    }
    for(let i=segments.length-1;i>=0;i--){
      if(t >= segments[i].s) return i;
    }
    return 0;
  }

  function effectiveBottom(){
    const c = linesEl.getBoundingClientRect();
    if(window.visualViewport){
      const vvB = window.visualViewport.offsetTop + window.visualViewport.height;
      return Math.min(c.bottom, vvB);
    }
    return c.bottom;
  }

  function setCurrent(i){
    if(i === current) return;

    const prev = linesEl.querySelector(".current");
    if(prev) prev.classList.remove("current");

    current = i;
    const cur = linesEl.querySelector(`.line[data-i="${i}"]`);

    if(cur){
      cur.classList.add("current");

      if(follow){
        const pad = 32;
        const c = linesEl.getBoundingClientRect();
        const r = cur.getBoundingClientRect();
        const eB = effectiveBottom() - pad;

        if(r.top < c.top + pad){
          linesEl.scrollBy({
            top: r.top - (c.top + pad),
            behavior: "smooth"
          });
        } else if(r.bottom > eB){
          linesEl.scrollBy({
            top: r.bottom - eB,
            behavior: "smooth"
          });
        }
      }
    }
  }

  audio.addEventListener("timeupdate", () => {
    setCurrent(findIndex(audio.currentTime));
  });

  audio.addEventListener("loadedmetadata", () => {
    setCurrent(findIndex(0));
  });
</script>
</body>
</html>
