<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ep 732: The State of the AI Race. Who will win in 2026: OpenAI, Microsoft, Google Or Anthropic (Start Here Series Vol 12)</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1a33;
      --text:#e8eefc;
      --muted:#a9b7d6;
      --hl:#ffe08a;
      --hlText:#1b1b1b;
      --bd:rgba(255,255,255,.12);
      --accent:#7aa2ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding-bottom:env(safe-area-inset-bottom);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg),#070b14);
      color:var(--text);
    }
    header{
      position:sticky;
      top:0;
      background:rgba(11,18,32,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--bd);
      z-index:10;
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:14px 12px;
    }
    h1{
      margin:0 0 6px;
      font-size:16px;
      line-height:1.35;
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    .player{
      margin-top:10px;
      padding:12px;
      background:rgba(15,26,51,.8);
      border:1px solid var(--bd);
      border-radius:14px;
    }
    audio{width:100%}
    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:10px;
    }
    .chip{
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:6px 10px;
      border:1px solid var(--bd);
      border-radius:999px;
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
    }
    a{
      color:var(--accent);
      text-decoration:none;
    }
    a:hover{text-decoration:underline}
    select,button{
      background:rgba(255,255,255,.05);
      color:var(--text);
      border:1px solid var(--bd);
      border-radius:10px;
      padding:6px 10px;
      font-size:12px;
    }
    button{cursor:pointer}
    .panel{
      margin-top:12px;
      background:rgba(15,26,51,.7);
      border:1px solid var(--bd);
      border-radius:14px;
      overflow:hidden;
    }
    .panel h2{
      margin:0;
      padding:12px;
      font-size:13px;
      color:var(--muted);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .lines{
      max-height:calc(100dvh - 320px);
      overflow:auto;
      padding:10px 10px 100px 10px;
      scroll-behavior:smooth;
    }
    .line{
      display:flex;
      gap:10px;
      padding:10px;
      border-radius:12px;
      border:1px solid transparent;
    }
    .line:hover{background:rgba(255,255,255,.03)}
    .t{
      min-width:70px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
      font-size:12px;
    }
    .txt{
      flex:1;
      line-height:1.4;
      font-size:14px;
    }
    .current{
      background:var(--hl);
      color:var(--hlText);
      border-color:rgba(0,0,0,.12);
    }
    .current .t{color:rgba(0,0,0,.62)}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Ep 732: The State of the AI Race. Who will win in 2026: OpenAI, Microsoft, Google Or Anthropic (Start Here Series Vol 12)</h1>
    <p class="sub">Line-level highlighting synced to narration audio. Tap a line to jump.</p>

    <div class="player">
      <audio id="audio" controls preload="metadata">
        <source src="https://tmpfiles.org/dl/34750478/ep732-state-of-the-ai-race.mp3" type="audio/mpeg">
      </audio>

      <div class="controls">
        <span class="chip">Audio: <a href="https://tmpfiles.org/dl/34750478/ep732-state-of-the-ai-race.mp3" target="_blank" rel="noreferrer">Source</a></span>
        <span class="chip">Timing: <a href="https://www.genspark.ai/api/files/s/zknAGp35" target="_blank" rel="noreferrer">Source</a></span>

        <label class="chip">Speed
          <select id="speed">
            <option value="0.8">0.8×</option>
            <option value="0.9">0.9×</option>
            <option value="1" selected>1.0×</option>
            <option value="1.1">1.1×</option>
            <option value="1.25">1.25×</option>
          </select>
        </label>

        <button id="follow">Auto-follow: ON</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <h2>Transcript</h2>
    <div class="lines" id="lines"></div>
  </section>
</main>

<script>
  const segments = [
    {s:0.22,e:1.50,t:"Good morning, everyone."},
    {s:2.50,e:8.74,t:"Today, we need to discuss a critical question for our business strategy, who will win the AI race in twenty twenty-six?"},
    {s:9.04,e:13.14,t:"And more importantly, how should our company navigate this highly competitive landscape?"},
    {s:14.16,e:19.56,t:"We are looking at a race dominated by the big four: OpenAI, Google, Microsoft, and Anthropic."},
    {s:20.58,e:24.60,t:"However, the nature of this race has fundamentally changed."},
    {s:24.66,e:28.46,t:"The era of the simple AI chatbot is officially over."},
    {s:28.52,e:31.16,t:"Today, we are in the era of agentic systems."},
    {s:32.16,e:40.92,t:"These are autonomous AI systems capable of executing complex business workflows and connecting directly with our daily data to deliver actionable enterprise-ready outputs."},

    {s:41.96,e:47.78,t:"To understand where we are, let us look at the incredible numbers driving this industry right now."},
    {s:47.88,e:51.10,t:"OpenAI is the undisputed leader in consumer adoption."},
    {s:52.07,e:58.90,t:"They have reached a staggering nine hundred million weekly active users and are generating an annualized revenue of twenty-five billion dollars."},
    {s:59.92,e:68.63,t:"Their newest model, GPT 5.4, is performing exceptionally well, achieving an eighty-three percent win or tie rate when compared to human experts in blind tests."},
    {s:69.67,e:73.16,t:"They have become completely synonymous with AI for the general public."},

    {s:74.24,e:77.59,t:"However, the enterprise and full-stack race is much more complex."},
    {s:78.66,e:85.32,t:"Google is taking a massive share of the market with seven hundred and fifty million monthly active users and eight million paid enterprise seats."},
    {s:86.36,e:90.24,t:"Google's true advantage is its multimodal capability."},
    {s:90.27,e:95.24,t:"They are the only major provider natively handling video alongside text, image, and audio."},
    {s:96.22,e:107.96,t:"By deeply integrating Gemini into Google Workspace, including Gmail, Drive, and Docs, Google is transforming daily operations so employees can analyze their data from anywhere within their organization."},

    {s:108.06,e:111.66,t:"Then we have Microsoft, which remains the enterprise control plane."},
    {s:112.52,e:117.56,t:"Microsoft has a major head start because its software is heavily embedded in corporate environments."},
    {s:118.54,e:125.66,t:"They currently have fifteen million paid Copilot seats with a remarkable ninety percent penetration rate among Fortune five hundred companies."},
    {s:126.68,e:133.20,t:"While their learning and governance curve can be high, Microsoft embeds AI by default across Word, Excel, Teams, and Outlook."},
    {s:134.20,e:143.56,t:"They are also heavily invested in the broader AI ecosystem, holding a twenty-seven percent stake in OpenAI's public benefits corporation and committing five billion dollars to Anthropic."},

    {s:144.66,e:146.84,t:"Finally, we must talk about Anthropic."},
    {s:147.74,e:156.84,t:"While they do not have the massive user base of OpenAI or Google, they are a financial powerhouse, reporting twenty billion dollars in annual recurring revenue."},
    {s:156.85,e:159.58,t:"Anthropic is winning in the premium intelligence layer."},
    {s:160.66,e:164.34,t:"Their models excel in complex reasoning and technical applications."},
    {s:165.26,e:167.84,t:"This is especially true in the new agent coding war."},
    {s:168.92,e:177.56,t:"Anthropic's Claude Code alone is reportedly responsible for four percent of all GitHub commits and reached two point five billion dollars in annual revenue within months of its launch."},
    {s:178.58,e:187.52,t:"Coding is the first area where AI is delivering direct, quantifiable productivity gains, and Anthropic is leading this high-value technical space."},

    {s:187.58,e:190.62,t:"The financial stakes are astronomical."},
    {s:190.66,e:195.20,t:"These companies are spending unbelievable amounts of money on infrastructure and data centers."},
    {s:196.26,e:205.02,t:"OpenAI is targeting six hundred billion dollars in compute spend through twenty thirty, while Google is planning up to one hundred and eighty-five billion dollars in capital expenditures."},

    {s:206.11,e:208.60,t:"So, what does this mean for us as business leaders?"},
    {s:209.61,e:213.71,t:"The winner in twenty twenty-six will not just be the company with the smartest model."},
    {s:214.80,e:221.05,t:"It will be the provider that best integrates seamlessly into our proprietary business data to deliver enterprise-grade results."},

    {s:222.18,e:224.04,t:"Our strategy must be flexible."},
    {s:225.10,e:230.04,t:"We must avoid relying entirely on a single vendor because models and platforms change constantly."},
    {s:231.08,e:232.27,t:"We need a modular approach."},
    {s:232.50,e:243.39,t:"We might use OpenAI for broad, everyday tasks, Google for multimodal content and scalable workspace integration, Anthropic for deep technical and coding work, and Microsoft for strict security and governance."},
    {s:244.44,e:250.21,t:"We must stop treating AI as a simple chatbot and start redesigning our internal workflows for agentic systems."},
    {s:251.22,e:258.88,t:"By preparing contingency plans and matching the right platform to the right problem, we can turn this AI competition into our own sustained business advantage."},
    {s:259.96,e:261.06,t:"Thank you for your time."}
  ];

  const audio = document.getElementById("audio");
  const linesEl = document.getElementById("lines");
  const speed = document.getElementById("speed");
  const followBtn = document.getElementById("follow");

  let follow = true;
  let current = -1;

  const fmt = sec => `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,"0")}`;

  segments.forEach((seg, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.dataset.i = i;
    row.innerHTML = `<div class="t">${fmt(seg.s)}</div><div class="txt">${seg.t}</div>`;
    row.onclick = () => {
      audio.currentTime = seg.s + 0.01;
      audio.play().catch(()=>{});
    };
    linesEl.appendChild(row);
  });

  speed.onchange = () => {
    audio.playbackRate = Number(speed.value);
  };

  followBtn.onclick = () => {
    follow = !follow;
    followBtn.textContent = `Auto-follow: ${follow ? "ON" : "OFF"}`;
  };

  function findIndex(t){
    for(let i=0;i<segments.length;i++){
      if(t >= segments[i].s && t < segments[i].e) return i;
    }
    for(let i=segments.length-1;i>=0;i--){
      if(t >= segments[i].s) return i;
    }
    return 0;
  }

  function effectiveBottom(){
    const c = linesEl.getBoundingClientRect();
    if(window.visualViewport){
      const vvB = window.visualViewport.offsetTop + window.visualViewport.height;
      return Math.min(c.bottom, vvB);
    }
    return c.bottom;
  }

  function setCurrent(i){
    if(i === current) return;

    const prev = linesEl.querySelector(".current");
    if(prev) prev.classList.remove("current");

    current = i;
    const cur = linesEl.querySelector(`.line[data-i="${i}"]`);

    if(cur){
      cur.classList.add("current");

      if(follow){
        const pad = 32;
        const c = linesEl.getBoundingClientRect();
        const r = cur.getBoundingClientRect();
        const eB = effectiveBottom() - pad;

        if(r.top < c.top + pad){
          linesEl.scrollBy({
            top: r.top - (c.top + pad),
            behavior: "smooth"
          });
        } else if(r.bottom > eB){
          linesEl.scrollBy({
            top: r.bottom - eB,
            behavior: "smooth"
          });
        }
      }
    }
  }

  audio.addEventListener("timeupdate", () => {
    setCurrent(findIndex(audio.currentTime));
  });

  audio.addEventListener("loadedmetadata", () => {
    setCurrent(findIndex(0));
  });
</script>
</body>
</html>
