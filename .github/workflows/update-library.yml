name: Update Library Index and README

on:
  push:
    paths:
      - "talks/**/index.html"
      - "tools/update_library.py"
      - "index.html"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: python tools/update_library.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add index.html README.md
          git commit -m "chore: auto-update library index and README"
          git push
